  <section id="contact" class="section">
    <div class="container">
      <h2 class="section-title">Get In Touch</h2>

      <div class="contact-form fade-in">
        <form action="https://formspree.io/f/mwpnzjnp" method="POST" id="contactForm">

          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your email" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Your message" required></textarea>
          </div>

          <button type="submit" class="btn submit-btn" id="submitBtn">Send Message</button>
          <div id="formStatus" class="form-status" role="alert"></div>
        </form>
      </div>
    </div>
  </section>

  <footer>
    <div class="container footer-content">
      <div class="footer-social">

      <p class="footer-message">Designed with care and Ghibli magic</p>
    </div>
  </footer>

  <div class="totoro" id="totoro"></div>
  <script src="script.js"></script>
</body>
